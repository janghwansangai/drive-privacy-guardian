name: release

# Tag push (v1.2.3) → tested, self-checked builds for macOS (Apple Silicon) and Windows x64 →
# SHA-256 checksums + build provenance attestation → a DRAFT GitHub Release to review by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            label: macOS-arm64
          - os: windows-latest
            label: Windows-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install (locked, hash-verified, incl. build tools)
        run: uv sync --locked --group build
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(uv run python -c "import dpg; print(dpg.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - name: Tests (sockets disabled, GUI offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q
      - name: License check (no GPL/AGPL at runtime)
        run: uv run python tools/check_licenses.py
      - name: macOS signing identity (self-signed, D-100; skipped without the secret)
        if: runner.os == 'macOS'
        shell: bash
        env:
          P12: ${{ secrets.MACOS_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "no signing secret: ad-hoc signature as before"; exit 0; fi
          kc="$RUNNER_TEMP/sign.keychain-db"
          kcpw=$(openssl rand -hex 16)
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/sign.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/sign.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          # codesign looks the certificate up through the search list (the runner is throwaway)
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          id=$(security find-identity -p codesigning "$kc" | awk '/\)/{print $2; exit}')
          test -n "$id" || { echo "signing identity not found"; exit 1; }
          echo "DPG_CODESIGN_IDENTITY=$id" >> "$GITHUB_ENV"
          echo "DPG_CODESIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"
      - name: Build + self-test of the built app + package + checksums
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: uv run --group build python tools/build.py
      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/sign.keychain-db" 2>/dev/null || true
      - name: Name the checksum file per platform
        shell: bash
        run: mv dist/SHA256SUMS.txt "dist/SHA256SUMS-${{ matrix.label }}.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.label }}
          path: |
            dist/DrivePrivacyGuardian-*
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Chrome extension — test and package
        run: |
          (cd extension/app && npm ci --no-audit --no-fund && npm test)
          python3 tools/build_extension.py
          (cd dist && sha256sum DrivePrivacyGuardian-Extension-*.zip > SHA256SUMS-Extension.txt)
      - name: One checksum file for everything
        run: |
          # the build jobs' checksums must still match after the artifact transfer
          cat dist/SHA256SUMS-*.txt > /tmp/build-sums.txt
          (cd dist && sha256sum -c /tmp/build-sums.txt)
          rm dist/SHA256SUMS-*.txt
          # Version-less copies so the website can link straight to
          # releases/latest/download/<name> without changing on every release.
          cd dist
          cp DrivePrivacyGuardian-*-Windows-x64.zip DrivePrivacyGuardian-Windows-x64.zip
          cp DrivePrivacyGuardian-*-macOS-arm64.dmg DrivePrivacyGuardian-macOS-arm64.dmg
          cp DrivePrivacyGuardian-Extension-*.zip DrivePrivacyGuardian-Extension.zip
          sha256sum DrivePrivacyGuardian-* | sort -k2 > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/DrivePrivacyGuardian-*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          body_path: packaging/RELEASE_NOTES_KO.md
          fail_on_unmatched_files: true
          files: |
            dist/DrivePrivacyGuardian-*
            dist/SHA256SUMS.txt
